name: Build full release APK

on:
  workflow_dispatch:
  push:
    branches: [transdroid3, transdroid3-mod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create a signing key
        run: |
          keytool -genkeypair -v -keystore transdroid-release.keystore -alias transdroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass transdroid-pass -keypass transdroid-pass \
            -dname "CN=Transdroid personal build"
          cat > keystore.properties <<PROPS
          storeFile=transdroid-release.keystore
          storePassword=transdroid-pass
          keyAlias=transdroid
          keyPassword=transdroid-pass
          PROPS
          sed -i 's/^ *//' keystore.properties

      - name: Assemble full release APK
        run: ./gradlew :app:assembleFullRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: transdroid-full-release
          path: app/build/outputs/apk/full/release/*.apk
